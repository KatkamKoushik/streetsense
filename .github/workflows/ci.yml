name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Check Python syntax compilation
        run: |
          python -m compileall backend/app backend/tests

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Verify database schema migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        run: |
          cd backend
          pytest -v

  web-console-build:
    name: web-console-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-console/package-lock.json

      - name: Install dependencies and build
        run: |
          cd web-console
          npm ci || npm install
          npm run build

  e2e-playwright:
    name: e2e-playwright
    runs-on: ubuntu-latest
    needs: [backend-tests, web-console-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-console/package-lock.json

      - name: Build Web Console Frontend
        run: |
          cd web-console
          npm ci || npm install
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies & Playwright Chromium
        run: |
          pip install -r backend/requirements.txt pytest pytest-asyncio playwright
          playwright install chromium --with-deps

      - name: Execute Playwright Browser E2E Tests
        run: |
          cd backend
          pytest tests/test_playwright_e2e.py -v

  ci-aggregate-gate:
    name: ci-aggregate-gate
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, web-console-build, e2e-playwright]
    if: always()
    steps:
      - name: Verify all required checks succeeded
        run: |
          if [ "${{ needs.backend-lint.result }}" != "success" ]; then
            echo "backend-lint failed"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "backend-tests failed"
            exit 1
          fi
          if [ "${{ needs.web-console-build.result }}" != "success" ]; then
            echo "web-console-build failed"
            exit 1
          fi
          if [ "${{ needs.e2e-playwright.result }}" != "success" ]; then
            echo "e2e-playwright failed"
            exit 1
          fi
          echo "All CI gates passed successfully."
